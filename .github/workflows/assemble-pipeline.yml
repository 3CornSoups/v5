name: assemble-pipeline
on:
  push:
    branches: [feat/omni-lora-backend]
    paths:
      - "src/_omni_pipeline_chunks/**"
      - ".github/workflows/assemble-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/omni-lora-backend
      - name: Concatenate chunks into src/pipeline.py
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'src/pipeline.py';
            const parts = [0, 1, 2, 3].map((i) =>
              fs.readFileSync(`src/_omni_pipeline_chunks/part${i}.txt`, 'utf8')
            );
            const content = parts.join('');
            if (content.length !== 32602) {
              throw new Error(`unexpected length ${content.length}, want 32602`);
            }
            if (!content.includes('omni_lora') || !content.includes('_enhance_omni_lora')) {
              throw new Error('assembled content missing omni_lora markers');
            }
            let sha;
            try {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: 'feat/omni-lora-backend',
              });
              sha = data.sha;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: 'feat: pipeline 接入本地 Omni+LoRA 快路径改写',
              content: Buffer.from(content, 'utf8').toString('base64'),
              branch: 'feat/omni-lora-backend',
              sha,
            });
            console.log('wrote src/pipeline.py', content.length, 'chars');
